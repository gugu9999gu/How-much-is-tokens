name: Run v1.0.31 Grok latest fix once

on:
  push:
    branches:
      - feat/v1.0.31-complete-account-automation
    paths:
      - .github/workflows/run-v1.0.31-grok-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1.0.31-complete-account-automation
      - run: node .github/scripts/v1.0.31-fix-grok-latest.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/cli-maintenance.js
          git commit -m "fix: parse Grok updater latest version correctly"
          git push origin HEAD:feat/v1.0.31-complete-account-automation
