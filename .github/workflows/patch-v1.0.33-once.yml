name: Patch v1.0.33 once

on:
  push:
    branches:
      - feat/v1.0.33-card-pins-autoheight
    paths:
      - .github/workflows/patch-v1.0.33-once.yml
      - scripts/patch-v1.0.33-once.js

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1.0.33-card-pins-autoheight
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/patch-v1.0.33-once.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preload.js lib/antigravity-account-manager.js package.json .github/workflows/build-windows.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire card pins auto-height and Antigravity summary fixes"
          git push origin HEAD:feat/v1.0.33-card-pins-autoheight
