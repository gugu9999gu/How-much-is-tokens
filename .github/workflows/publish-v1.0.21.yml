name: Publish v1.0.21 Release

on:
  push:
    branches:
      - main
    paths:
      - .release-trigger-v1.0.21

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33868806819 \
            --repo "$GITHUB_REPOSITORY" \
            --name How-much-is-tokens-windows-portable \
            --dir release-artifact

      - name: Verify release asset
        run: |
          test -f release-artifact/How-much-is-tokens-1.0.21-portable.exe
          echo "77caa9a26d0659910f48bcfdd058c62441cc733d2e6d1a2f2d9b61bc996ac58f  release-artifact/How-much-is-tokens-1.0.21-portable.exe" | sha256sum -c -

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## How much is tokens v1.0.21

          ### Codex / Work banked reset 자동 사용
          - 설정 → 자동화 → `Codex 한도 자동 리셋` 추가, 기본값 OFF
          - UI의 0% 숫자가 아니라 공식 `account/rateLimits/read`의 실제 `rate_limit_reached` 상태에서만 실행
          - 사용 가능한 banked reset이 있을 때 가장 먼저 만료되는 available 티켓을 우선 선택
          - 공식 `account/rateLimitResetCredit/consume` 사용
          - limit-id + reset boundary 기반 epoch fingerprint로 같은 quota 구간의 중복 사용 방지
          - persistent idempotency key를 사용해 timeout/불확실한 실패 재시도도 중복 redeem 방지
          - 성공 후 rate limits와 WHAM usage를 다시 읽어 실제 복구된 사용량을 즉시 반영
          - 설정값 초기화 시 자동 리셋은 다시 OFF

          ### AI 플랫폼별 크레딧 / 잔액 표시
          Provider가 실제 balance/limit 필드를 제공하는 경우에만 별도 크레딧 영역에 표시합니다.
          - Codex / Work: 보유 credits, 월간 credit limit
          - Claude: Usage Credits / spend limit
          - Cursor: 포함 크레딧, On-demand, 팀 공유/팀 On-demand
          - Grok: prepaid balance, On-demand cap/usage
          - Grok Bot: Cursor billing On-demand balance
          - OpenRouter: account credits, API Key spending cap
          - GitHub Copilot: premium request entitlement/remaining (`요청` 단위)
          - Antigravity: 확인 가능한 monetary credit balance가 없어 quota만 유지
          - 금액이 아닌 단위를 USD로 추정하지 않고, upstream에 없는 credit도 생성하지 않음

          ### Claude Fable / scoped quota
          - 현재 Claude OAuth usage의 `limits[]` / model-scoped quota를 독립 게이지로 표시
          - `weekly_scoped`의 `scope.model.display_name`을 사용해 Fable 및 향후 named model quota를 자동 표시
          - 호환 `seven_day_overage_included`를 Fable 주간 한도로 명시 매핑
          - 5시간/세션, 전체 주간, Fable, Sonnet/Opus 등 실제로 존재하는 bucket을 동시에 표시
          - 임의의 내부 `seven_day_*` codename은 모델 이름으로 추정하지 않음

          ### 다계정 확장 기반
          - provider + account를 raw ID 대신 SHA-256 기반 `accountKey`로 구분
          - quota/credit persistent cache와 Codex 자동화 상태를 계정별로 분리
          - raw account ID나 OAuth token은 usage cache/automation state에 저장하지 않음
          - 이번 버전은 다계정 데이터 모델 기반까지 포함하며, 여러 isolated login profile을 실제 자동 전환하는 router는 후속 단계

          ### 검증
          이 EXE는 `main` commit `0f4200e13223365264b82b9170ab78aac5cd7410`에서 GitHub Actions Windows runner로 검증된 artifact입니다.
          - Codex auto-reset OFF / actual-reached / no-credit / same-epoch / new-epoch / idempotent retry tests
          - reset consume RPC / earliest-expiring ticket tests
          - Claude Fable/current scoped limits/no-fabrication/Usage Credits tests
          - Codex/Cursor/Copilot/Grok/Grok Bot/OpenRouter credit fixtures
          - account-isolated persistent cache tests
          - Windows Electron safeStorage/DPAPI secure storage smoke test
          - 실제 Electron renderer titlebar isolation smoke test
          - Antigravity Windows bridge smoke test
          - electron-builder Windows portable build

          SHA-256: `77caa9a26d0659910f48bcfdd058c62441cc733d2e6d1a2f2d9b61bc996ac58f`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.21"
          ASSET="release-artifact/How-much-is-tokens-1.0.21-portable.exe"
          TARGET="0f4200e13223365264b82b9170ab78aac5cd7410"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
