name: Publish v1.0.20 Release

on:
  push:
    branches:
      - main
    paths:
      - .release-trigger-v1.0.20

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33830800835 \
            --repo "$GITHUB_REPOSITORY" \
            --name How-much-is-tokens-windows-portable \
            --dir release-artifact

      - name: Verify release asset
        run: |
          test -f release-artifact/How-much-is-tokens-1.0.20-portable.exe
          echo "e019ea7cb21ef3b08afb62fd6f7b4bab6b97d116ebd41b9f8f1925b6a389e631  release-artifact/How-much-is-tokens-1.0.20-portable.exe" | sha256sum -c -

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## How much is tokens v1.0.20

          ### Codex / Work banked reset 표시
          - 공식 Codex app-server의 read-only `account/rateLimits/read` 사용
          - `rateLimitResetCredits.availableCount`를 현재 사용 가능한 reset 총수로 표시
          - backend가 detail을 제공하면 각 티켓의 title / resetType / status / grantedAt / expiresAt을 읽음
          - 상세 보기에서 `Codex/Work 리셋 N개`와 만료가 빠른 티켓 최대 3개를 `D-N · YYYY-MM-DD`로 표시
          - `credits=null`인 count-only 응답에서는 개수만 표시하고 개별 만료일을 추정하지 않음
          - detail 배열이 총수보다 짧아도 배열 길이로 total count를 덮어쓰지 않음
          - 이미 만료된 detail row는 유효 티켓으로 표시하지 않음

          ### 안전성
          - reset 조회만 수행하며 `account/rateLimitResetCredit/consume`은 호출하지 않음
          - 위젯 표시/새로고침으로 banked reset이 소비되지 않음
          - banked reset은 일반 ChatGPT 메시지 한도나 API credit과 구분해 `Codex/Work 리셋`으로 표기

          ### Grok
          - 기존 xAI shared billing period의 자동 reset 시각 표시는 유지
          - 현재 machine-readable Grok billing data에 Codex와 동등한 one-time reset-ticket inventory가 없으므로 개수/만료일을 임의 생성하지 않음

          ### 검증
          이 EXE는 `main` commit `cf98f9be00f73bb414ad8aeb4111c002b2ae0266`에서 GitHub Actions Windows runner로 검증된 artifact입니다.
          - authoritative reset count / truncated details test
          - count-only response / expired detail filtering test
          - read-only app-server RPC / consume-not-called guard
          - OpenRouter parser / Windows DPAPI secure storage tests
          - 실제 Electron renderer titlebar isolation smoke test
          - 기존 provider / quota / visualization / edge / usage-cache tests
          - Antigravity Windows bridge smoke test
          - electron-builder Windows portable build

          SHA-256: `e019ea7cb21ef3b08afb62fd6f7b4bab6b97d116ebd41b9f8f1925b6a389e631`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.20"
          ASSET="release-artifact/How-much-is-tokens-1.0.20-portable.exe"
          TARGET="cf98f9be00f73bb414ad8aeb4111c002b2ae0266"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
