name: Verify Release Repository Token Once

on:
  push:
    branches:
      - chore/finalize-private-public-split

permissions:
  contents: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_REPO: gugu9999gu/How-much-is-tokens-releases
      GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
    steps:
      - name: Verify token can read and write releases
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "RELEASE_REPO_TOKEN is missing" >&2
            exit 1
          fi

          gh api "repos/$RELEASE_REPO" --silent

          tag="token-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_json="$(gh api --method POST "repos/$RELEASE_REPO/releases" \
            -f tag_name="$tag" \
            -f target_commitish="main" \
            -f name="Temporary release-token verification" \
            -f body="Temporary draft created only to verify cross-repository release permissions." \
            -F draft=true)"
          release_id="$(printf '%s' "$release_json" | jq -r '.id')"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "Failed to create temporary draft release" >&2
            exit 1
          fi

          gh api --method DELETE "repos/$RELEASE_REPO/releases/$release_id"
          gh api --method DELETE "repos/$RELEASE_REPO/git/refs/tags/$tag" >/dev/null 2>&1 || true
          echo "RELEASE_REPO_TOKEN read/write verification passed"
