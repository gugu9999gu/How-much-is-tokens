name: Sync v1.0.32 MCP lockfile once

on:
  push:
    branches:
      - feat/v1.0.32-media-mcp-accounts
    paths:
      - .github/workflows/sync-v1.0.32-lock-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1.0.32-media-mcp-accounts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "chore: sync v1.0.32 MCP dependency lockfile"
          git push origin HEAD:feat/v1.0.32-media-mcp-accounts
