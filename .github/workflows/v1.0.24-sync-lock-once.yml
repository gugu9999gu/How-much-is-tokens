name: Sync v1.0.24 Package Lock Once

on:
  push:
    branches:
      - feat/v1.0.24-openrouter-local-router

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/v1.0.24-openrouter-local-router
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync package version and lock
        run: npm version 1.0.24 --no-git-tag-version --allow-same-version

      - name: Commit package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: sync v1.0.24 package lock"
          git push origin HEAD:feat/v1.0.24-openrouter-local-router
