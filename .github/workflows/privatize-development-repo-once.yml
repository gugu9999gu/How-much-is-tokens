name: Privatize Development Repository Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/privatize-development-repo-once.yml

permissions:
  contents: read

jobs:
  privatize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Make development repository private
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASE_REPO_TOKEN is not configured" >&2
            exit 1
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY" -F private=true > repo.json
          node -e "const r=require('./repo.json'); if(r.private!==true){throw new Error('repository is still public')} console.log('development repository is private')"

      - name: Confirm release repository remains public
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        shell: bash
        run: |
          gh api "repos/gugu9999gu/How-much-is-tokens-releases" > release-repo.json
          node -e "const r=require('./release-repo.json'); if(r.private!==false){throw new Error('release repository is not public')} console.log('release repository remains public')"
