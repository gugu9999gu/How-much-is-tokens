name: Publish v1.0.18 Release

on:
  push:
    branches:
      - main
    paths:
      - .release-trigger-v1.0.18

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33710349301 \
            --repo "$GITHUB_REPOSITORY" \
            --name How-much-is-tokens-windows-portable \
            --dir release-artifact

      - name: Verify release asset
        run: |
          test -f release-artifact/How-much-is-tokens-1.0.18-portable.exe
          echo "910f0e56c2b64defd925ecddfd36fe663f5c7b0a6365e1b061c865207bf81e47  release-artifact/How-much-is-tokens-1.0.18-portable.exe" | sha256sum -c -

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## How much is tokens v1.0.18

          ### Grok 사용량 계산 수정
          - xAI의 `creditUsagePercent`를 실제 공유 billing pool 사용률로 사용
          - `productUsage[].usagePercent`를 독립 잔여 quota로 잘못 표시하던 문제 수정
          - GrokBuild / GrokChat / GrokAppBuilder는 공유 풀의 제품별 **사용 기여도**로 표시
          - 예: Build 95% + Chat 3% + AppBuilder 2% = 공유 풀 100% 사용 → 실제 잔여 0%
          - 제품별 표시는 `GrokBuild 사용 95%`, `GrokChat 사용 3%` 형태로 변경
          - productUsage만 존재하는 구형 payload는 합계를 공유 풀 사용률 fallback으로 계산
          - 유효한 current period에서 사용량 필드가 모두 생략되면 0% 사용으로 처리
          - weekly/monthly period에 따라 공유 한도 라벨을 구분

          ### 기존 잘못된 cache 정리
          - v1.0.17 이전에 저장된 GrokBuild/GrokChat/GrokAppBuilder 독립 잔여 window를 stale cache에서 자동 폐기
          - 실제 공유 weekly/monthly quota만 유지

          ### 검증
          이 EXE는 `main` commit `7a05f7d6b51dfa8fce0d43e2afde272c054aa06a`에서 GitHub Actions Windows runner로 검증된 artifact입니다.
          - Grok 95/3/2 shared-pool fixture test
          - productUsage sum fallback / zero-usage period tests
          - legacy Grok cache migration test
          - 기존 provider / quota / visualization / edge / usage-cache tests
          - 실제 Electron renderer titlebar isolation smoke test
          - Antigravity Windows bridge smoke test
          - electron-builder Windows portable build

          SHA-256: `910f0e56c2b64defd925ecddfd36fe663f5c7b0a6365e1b061c865207bf81e47`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.18"
          ASSET="release-artifact/How-much-is-tokens-1.0.18-portable.exe"
          TARGET="7a05f7d6b51dfa8fce0d43e2afde272c054aa06a"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
