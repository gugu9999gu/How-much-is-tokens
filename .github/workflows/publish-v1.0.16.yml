name: Publish v1.0.16 Release

on:
  push:
    branches:
      - main
    paths:
      - .release-trigger-v1.0.16

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33617215536 \
            --repo "$GITHUB_REPOSITORY" \
            --name How-much-is-tokens-windows-portable \
            --dir release-artifact

      - name: Verify release asset
        run: |
          test -f release-artifact/How-much-is-tokens-1.0.16-portable.exe
          echo "c6be0cb3a1a5eb2f2bd2a9912c4591817c18bbefb7fe3abfe7a332569a903984  release-artifact/How-much-is-tokens-1.0.16-portable.exe" | sha256sum -c -

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## How much is tokens v1.0.16

          ### CLI 종료·유휴 후 게이지가 사라지는 문제 수정
          - 정상 조회된 quota를 안전한 last-known-good snapshot으로 저장
          - 터미널을 닫은 뒤 access token이 만료되어 `login` 또는 일시적 조회 오류가 발생해도 아직 유효한 quota 게이지는 `이전 값`으로 유지
          - 5시간 quota의 reset 시간이 지나면 stale cache에서 해당 window만 제거하고, 아직 유효한 주간 quota가 있으면 주간 값을 대표 게이지로 사용
          - 모든 quota reset 시간이 지나면 과거 값을 더 이상 현재 게이지로 표시하지 않음
          - credential 파일이 사라진 `missing` 상태는 명시적 로그아웃/미설정으로 취급해 이전 계정을 되살리지 않음

          ### Claude
          - usage API가 정상 응답했는데 로컬 `.credentials.json`의 `expiresAt`만 지났다는 이유로 정상 사용량을 폐기하던 조건 제거
          - 실제 HTTP 401/403일 때만 인증 갱신 필요로 판단
          - 인증 갱신이 필요한 동안에도 reset 전 마지막 유효 quota는 유지

          ### Codex
          - usage API 401/403 발생 시 공식 `codex app-server` stable API로 관리형 ChatGPT OAuth refresh 시도
          - `account/read { refreshToken: true }` 호출 후 Codex가 자체적으로 토큰 rotation/persistence 처리
          - refresh 성공 시 `auth.json`을 다시 읽어 usage API를 1회 재시도
          - 모델 turn을 생성하지 않으므로 이 refresh 자체는 AI quota를 사용하지 않음
          - refresh가 불가능한 경우에도 reset 전 마지막 정상 quota는 유지

          ### 보안
          - `%APPDATA%\\how-much-is-tokens\\usage-cache.json`에는 quota 퍼센트, reset 시각, 서비스/플랜 식별 정보만 저장
          - access token, refresh token, cookie, 이메일은 usage cache에 저장하지 않음
          - Codex OAuth refresh는 위젯이 토큰을 직접 회전하지 않고 Codex app-server에 위임

          ### 검증
          이 EXE는 `main` commit `4f79d0a04bf02a94a1c9347ed51b85b22acf5316`에서 GitHub Actions Windows runner로 검증된 artifact입니다.
          - persistent quota cache / reset-boundary tests
          - cache secret-field exclusion tests
          - Codex app-server managed auth refresh RPC tests
          - Claude/Codex/provider 기존 회귀 테스트
          - Antigravity / Grok Bot / quota / visualization / edge / settings-reset tests
          - Antigravity Windows bridge smoke test
          - electron-builder Windows portable build

          SHA-256: `c6be0cb3a1a5eb2f2bd2a9912c4591817c18bbefb7fe3abfe7a332569a903984`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.16"
          ASSET="release-artifact/How-much-is-tokens-1.0.16-portable.exe"
          TARGET="4f79d0a04bf02a94a1c9347ed51b85b22acf5316"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
