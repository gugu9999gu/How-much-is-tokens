name: Close Leerness Session Once

on:
  push:
    branches:
      - chore/record-release-token-verified

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      LEERNESS_NO_PROMPT: "1"
      LEERNESS_NO_AUTOCHCP: "1"
      LEERNESS_NO_DRIFT_CHECK: "1"

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/record-release-token-verified
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Leerness gate
        run: npm run leerness:gate

      - name: Close Leerness session
        run: npm run leerness:close

      - name: Commit Leerness handoff
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .leerness
          if (git diff --cached --quiet) {
            Write-Host "Leerness session close produced no repository changes."
            exit 0
          }
          git commit -m "chore: close Leerness release-split session"
          git push origin HEAD:chore/record-release-token-verified
