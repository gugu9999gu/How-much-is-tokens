name: Build Windows Portable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned Leerness workspace
        shell: pwsh
        env:
          LEERNESS_NO_PROMPT: "1"
          LEERNESS_NO_AUTOCHCP: "1"
          LEERNESS_NO_DRIFT_CHECK: "1"
        run: |
          npx --no-install leerness --version
          npx --no-install leerness workspace-dir get --path . --json
          npm run leerness:status

      - name: Scan committed secrets
        shell: pwsh
        env:
          LEERNESS_NO_PROMPT: "1"
          LEERNESS_NO_AUTOCHCP: "1"
          LEERNESS_NO_DRIFT_CHECK: "1"
        run: npx --no-install leerness scan secrets .

      - name: Syntax check
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check lib/usage.js
          node --check lib/usage-cache.js
          node --check lib/account-identity.js
          node --check lib/account-display-identity.js
          node --check lib/account-dedupe.js
          node --check lib/account-profiles.js
          node --check lib/account-router.js
          node --check lib/routed-launcher.js
          node --check lib/credential-login.js
          node --check lib/cli-maintenance.js
          node --check lib/cli-maintenance-main-integration.js
          node --check lib/credit-balances.js
          node --check lib/codex-app-server.js
          node --check lib/codex-rate-limits.js
          node --check lib/codex-reset-credit.js
          node --check lib/codex-auto-reset.js
          node --check lib/settings.js
          node --check lib/secure-secrets.js
          node --check lib/openrouter-profiles.js
          node --check lib/openrouter-request-router.js
          node --check lib/openrouter-oauth.js
          node --check lib/openrouter-account-identity.js
          node --check lib/openrouter-main-integration.js
          node --check lib/api-providers-main-integration.js
          node --check lib/api-providers/common.js
          node --check lib/api-providers/registry.js
          node --check lib/api-providers/falai.js
          node --check lib/api-providers/higgsfield.js
          node --check lib/api-providers/magnific.js
          node --check lib/api-providers/elevenlabs.js
          node --check lib/api-providers/stability.js
          node --check lib/window-behavior.js
          node --check lib/window-resize.js
          node --check lib/window-resize-main-integration.js
          node --check lib/edge-dock.js
          node --check lib/antigravity-bridge.js
          node --check lib/antigravity-cli.js
          node --check lib/providers/antigravity.js
          node --check lib/providers/claude.js
          node --check lib/providers/codex.js
          node --check lib/providers/copilot.js
          node --check lib/providers/cursor-auth.js
          node --check lib/providers/cursor.js
          node --check lib/providers/grok.js
          node --check lib/providers/grokbot.js
          node --check lib/providers/openrouter.js
          node --check renderer/app.js
          node --check renderer/openrouter-settings.js
          node --check renderer/connection-settings.js
          node --check renderer/api-providers-settings.js
          node --check renderer/widget-enhancements.js
          node --check renderer/account-identity-ui.js
          node --check test/claude-usage.test.js
          node --check test/cursor-credits.test.js
          node --check test/copilot-credits.test.js
          node --check test/codex-credits.test.js
          node --check test/codex-auto-reset.test.js
          node --check test/multi-account.test.js
          node --check test/account-router.test.js
          node --check test/routed-launcher.test.js
          node --check test/credential-login.test.js
          node --check test/connection-settings.test.js
          node --check test/api-providers.test.js
          node --check test/api-provider-secrets.test.js
          node --check test/openrouter-profiles.test.js
          node --check test/openrouter-request-router.test.js
          node --check test/openrouter-oauth.test.js
          node --check test/openrouter-account-identity.test.js
          node --check test/openrouter-security.test.js
          node --check test/window-resize.test.js
          node --check test/cli-maintenance.test.js
          node --check test/credential-disconnect.test.js
          node --check test/account-display-identity.test.js
          node --check test/account-dedupe.test.js
          node --check test/widget-enhancements.test.js
          node --check test/repository-split-leerness.test.js
          node --check test/renderer-layout-smoke.js
          node --check test/renderer-layout-preload.js
          node --check test/secure-secrets-smoke.js

      - name: Run tests
        run: npm test

      - name: Run Leerness gate
        shell: pwsh
        env:
          LEERNESS_NO_PROMPT: "1"
          LEERNESS_NO_AUTOCHCP: "1"
          LEERNESS_NO_DRIFT_CHECK: "1"
        run: npm run leerness:gate

      - name: Smoke test Windows secure secret storage
        run: npm run test:secure-secrets

      - name: Smoke test renderer titlebar isolation
        run: npm run test:renderer-layout

      - name: Smoke test Antigravity Windows bridge
        shell: pwsh
        run: |
          $agyDir = Join-Path $HOME ".gemini\antigravity-cli"
          New-Item -ItemType Directory -Force -Path $agyDir | Out-Null
          $settingsPath = Join-Path $agyDir "settings.json"
          [IO.File]::WriteAllText($settingsPath, "{}", (New-Object Text.UTF8Encoding($false)))

          node -e "const r=require('./lib/antigravity-bridge').ensureBridgeInstalled(); if(!r.ok) throw new Error(JSON.stringify(r)); if(r.command.includes(' -File ')) throw new Error('quoted -File leaked into Antigravity command'); console.log(r.command);"

          $settings = Get-Content -Raw -LiteralPath $settingsPath | ConvertFrom-Json
          $command = [string]$settings.statusLine.command
          if ($command -match '"') { throw "Antigravity command contains quote characters: $command" }

          $fixture = '{"version":"1.0-test","email":"developer@example.com","plan_tier":"Pro","quota":{"gemini-weekly":{"remaining_fraction":0.75,"reset_in_seconds":3600},"3p-5h":{"remaining_fraction":0.42,"reset_in_seconds":1200}}}'
          $fixture | cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "Statusline command failed with exit code $LASTEXITCODE" }

          $snapshotPath = Join-Path $env:APPDATA "how-much-is-tokens\antigravity-status.json"
          if (!(Test-Path -LiteralPath $snapshotPath)) { throw "Snapshot was not created" }
          $snapshot = Get-Content -Raw -LiteralPath $snapshotPath | ConvertFrom-Json
          if ($snapshot.accounts.Count -lt 1) { throw "Snapshot contains no account" }
          if ($snapshot.accounts[0].quota.'gemini-weekly'.remaining_fraction -ne 0.75) { throw "Gemini quota was not captured" }
          if ($snapshot.accounts[0].quota.'3p-5h'.remaining_fraction -ne 0.42) { throw "Third-party quota was not captured" }

      - name: Build portable EXE
        run: npm run dist

      - name: Upload portable build
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: How-much-is-tokens-windows-portable
          path: dist/*-portable.exe
          if-no-files-found: error
          retention-days: 3
