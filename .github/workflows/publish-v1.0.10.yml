name: Publish v1.0.10 Release

on:
  push:
    branches:
      - main
    paths:
      - .release-trigger-v1.0.10

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33494887459 \
            --repo "$GITHUB_REPOSITORY" \
            --name How-much-is-tokens-windows-portable \
            --dir release-artifact

      - name: Verify release asset
        run: |
          test -f release-artifact/How-much-is-tokens-1.0.10-portable.exe
          echo "5c62976ececb55ca0f76575f33b7eae0532461490a1e1742bbba2b89f0f53477  release-artifact/How-much-is-tokens-1.0.10-portable.exe" | sha256sum -c -

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## How much is tokens v1.0.10

          ### 주요 변경 사항
          - **사용량 시각화 방식 선택**
            - 설정 → 표시에서 `원형`, `막대`, `숫자` 모드 선택
            - 선택 즉시 저장되고 위젯에 바로 반영
            - 다음 실행에도 선택값 유지
            - 기존 사용자 기본값은 `원형`
          - **다중 quota 시각화**
            - 5시간 / 주간 / 모델별 주간 한도가 모두 선택한 그래프 방식으로 함께 전환
            - Compact 모드에서도 대표 잔여량에 선택한 방식 유지
          - 잘못된/구버전 visualization 설정은 안전하게 `원형`으로 복구
          - v1.0.9의 Antigravity 자동 `/usage` 갱신, 제공자별 정렬, 높이 자동 확장, Grok Bot 사용량 지원 유지

          ### Windows
          `How-much-is-tokens-1.0.10-portable.exe`를 설치 없이 실행하면 됩니다.

          Windows SmartScreen 경고가 표시될 수 있습니다. 현재 코드 서명은 적용되어 있지 않습니다.

          ### 검증
          이 EXE는 `main` commit `7a63ee4d3a9c651cea83e0c8aa462abdef2db7d6`에서 GitHub Actions Windows runner로 검증된 artifact입니다.
          - JavaScript syntax check
          - visualization mode/default/fallback tests
          - Antigravity live `/usage` + status-line tests
          - Grok Bot / provider grouping / quota pairing tests
          - Antigravity Windows status-line bridge smoke test
          - electron-builder Windows portable build

          SHA-256: `5c62976ececb55ca0f76575f33b7eae0532461490a1e1742bbba2b89f0f53477`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.10"
          ASSET="release-artifact/How-much-is-tokens-1.0.10-portable.exe"
          TARGET="7a63ee4d3a9c651cea83e0c8aa462abdef2db7d6"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
