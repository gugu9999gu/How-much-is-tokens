name: Publish v1.0.17 Release

on:
  push:
    branches:
      - main
    paths:
      - .release-trigger-v1.0.17

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33620630862 \
            --repo "$GITHUB_REPOSITORY" \
            --name How-much-is-tokens-windows-portable \
            --dir release-artifact

      - name: Verify release asset
        run: |
          test -f release-artifact/How-much-is-tokens-1.0.17-portable.exe
          echo "be9f401ff54eb1567d5f06c6081f9edf3f7e081a2a40fbe322616db739db6128  release-artifact/How-much-is-tokens-1.0.17-portable.exe" | sha256sum -c -

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## How much is tokens v1.0.17

          ### 엣지 활성화 시 헤더/설정 요소가 겹치는 문제 수정
          - titlebar와 스크롤 콘텐츠를 DOM 구조부터 분리
          - titlebar 아래에 전용 `content-viewport`를 두고 토큰 목록/설정만 내부 스크롤
          - titlebar를 비스크롤 고정 영역과 독립 stacking context로 유지
          - root html/body를 Electron viewport에 고정해 focused control에 의한 문서 전체 스크롤 차단
          - 엣지 ON/OFF/방향 변경/native window 이동/높이 변경 중에도 헤더와 버튼이 설정 패널에 가려지지 않도록 수정
          - 기존 native edge animation은 position-only 방식 유지

          ### 실제 Electron 레이아웃 회귀 테스트 추가
          Windows CI에서 Electron BrowserWindow를 실제 실행해 다음 상태를 검증합니다.
          - 설정 패널 320px 스크롤
          - root document scroll 시도
          - 엣지 활성화
          - native window 위치 이동
          - 창 높이 320px 축소
          - 엣지 방향 변경
          - 엣지 비활성화
          - 모든 단계에서 `contentViewport.top >= titlebar.bottom`, titlebar 높이 유지, rootScroll=0 확인

          ### 유지 기능
          - CLI 종료/유휴 후 사용량 게이지 유지 및 Codex 관리형 OAuth refresh
          - 화면 밖 위치 자동 복구 / 트레이 설정값 초기화
          - 토큰 영역 최대 높이 / 내부 스크롤 / 촘촘하게
          - 상/우/하/좌 엣지 hover 패널
          - 원형 / 막대 / 숫자 시각화
          - 5시간 / 주간 quota 동시 표시
          - Antigravity 자동 `/usage` 갱신 / Grok Bot 사용량

          ### 검증
          이 EXE는 `main` commit `4f907cb647064c17d17e65ab41f48cf49d0f4f45`에서 GitHub Actions Windows runner로 검증된 artifact입니다.
          - JavaScript syntax check
          - 기존 provider / quota / visualization / edge / settings-reset / usage-cache tests
          - **실제 Electron renderer titlebar isolation smoke test**
          - Antigravity Windows bridge smoke test
          - electron-builder Windows portable build

          SHA-256: `be9f401ff54eb1567d5f06c6081f9edf3f7e081a2a40fbe322616db739db6128`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.17"
          ASSET="release-artifact/How-much-is-tokens-1.0.17-portable.exe"
          TARGET="4f907cb647064c17d17e65ab41f48cf49d0f4f45"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
