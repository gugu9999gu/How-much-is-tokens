name: Publish v1.0.11 Release

on:
  push:
    branches:
      - main
    paths:
      - .release-trigger-v1.0.11

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33499484948 \
            --repo "$GITHUB_REPOSITORY" \
            --name How-much-is-tokens-windows-portable \
            --dir release-artifact

      - name: Verify release asset
        run: |
          test -f release-artifact/How-much-is-tokens-1.0.11-portable.exe
          echo "ead9eaaa34bace9909c9b84564128926a9fcf44abd031009c3c248f1a5eef6c2  release-artifact/How-much-is-tokens-1.0.11-portable.exe" | sha256sum -c -

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## How much is tokens v1.0.11

          ### 버그 수정
          - **항상 위에 토글 비활성화 즉시 적용**
            - 설정의 `항상 위에` 스위치를 끄는 즉시 설정 저장
            - Electron 네이티브 창에 `setAlwaysOnTop(false)`를 즉시 적용해 normal z-order로 복귀
            - 활성화 시 기존 screen-saver level 동작 유지
            - 트레이에서 다시 표시하거나 두 번째 실행으로 포커스할 때 저장된 설정을 재적용
            - Windows z-order 전환 상태가 지연되는 경우 한 번 재확인/재적용
          - 저장 버튼을 누르기 전까지 토글이 화면에만 바뀌던 동작 수정
          - v1.0.10의 원형/막대/숫자 시각화와 Antigravity 자동 quota 갱신 유지

          ### Windows
          `How-much-is-tokens-1.0.11-portable.exe`를 설치 없이 실행하면 됩니다.

          ### 검증
          이 EXE는 `main` commit `321146746788d573980c3b15096997474afa27ee`에서 GitHub Actions Windows runner로 검증된 artifact입니다.
          - JavaScript syntax check
          - always-on-top enable/disable native behavior tests
          - renderer immediate toggle persistence test
          - 기존 Antigravity / Grok Bot / provider / quota / visualization tests
          - Antigravity Windows bridge smoke test
          - electron-builder Windows portable build

          SHA-256: `ead9eaaa34bace9909c9b84564128926a9fcf44abd031009c3c248f1a5eef6c2`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.11"
          ASSET="release-artifact/How-much-is-tokens-1.0.11-portable.exe"
          TARGET="321146746788d573980c3b15096997474afa27ee"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
