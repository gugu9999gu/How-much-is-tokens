name: Publish v1.0.9 Release

on:
  push:
    branches:
      - main
    paths:
      - .release-trigger-v1.0.9

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33484293214 \
            --repo "$GITHUB_REPOSITORY" \
            --name How-much-is-tokens-windows-portable \
            --dir release-artifact

      - name: Verify release asset
        run: |
          test -f release-artifact/How-much-is-tokens-1.0.9-portable.exe
          echo "1e97e1d35c563a5704d6c6d9354ab311149ef3eb71affd9ced6b289aefe3ca68  release-artifact/How-much-is-tokens-1.0.9-portable.exe" | sha256sum -c -

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## How much is tokens v1.0.9

          ### 주요 변경 사항
          - **5시간/주간 quota 원형 그래프**
            - 5시간 한도가 있는 서비스는 상세 모드에서 quota별 독립 원형 그래프 표시
            - 5시간, 주간, 모델별 추가 주간 quota의 남은 %와 리셋 시간을 각각 표시
            - Compact 모드는 대표 원형 그래프 1개 유지
          - **Antigravity 자동 quota 갱신**
            - agy 1.1.11+에서 공식 read-only `agy -p "/usage"` 경로 사용
            - Gemini / Claude·GPT 5시간 및 주간 quota를 실시간으로 갱신
            - 위젯이 Antigravity 자격증명을 직접 읽거나 저장하지 않음
            - agy 1.1.10 이하는 안전상 자동 `/usage` 호출 금지
            - 최신 CLI 호출 실패 시 기존 공식 status-line snapshot으로 fallback
          - v1.0.8의 제공자별 정렬, 높이 자동 확장, Grok Bot 사용량 지원 유지

          ### Windows
          `How-much-is-tokens-1.0.9-portable.exe`를 설치 없이 실행하면 됩니다.

          Windows SmartScreen 경고가 표시될 수 있습니다. 현재 코드 서명은 적용되어 있지 않습니다.

          ### 검증
          이 EXE는 `main` commit `49241bd5874f8a11c38bbab386883d897ee23c76`에서 GitHub Actions Windows runner로 검증된 artifact입니다.
          - JavaScript syntax check
          - Antigravity status-line + live `/usage` parser/version safety tests
          - Grok Bot / provider grouping / quota pairing tests
          - Antigravity Windows status-line bridge smoke test
          - electron-builder Windows portable build

          SHA-256: `1e97e1d35c563a5704d6c6d9354ab311149ef3eb71affd9ced6b289aefe3ca68`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.9"
          ASSET="release-artifact/How-much-is-tokens-1.0.9-portable.exe"
          TARGET="49241bd5874f8a11c38bbab386883d897ee23c76"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
