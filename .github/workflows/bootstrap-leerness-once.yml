name: Bootstrap Leerness Once

on:
  push:
    branches:
      - chore/private-release-split-leerness

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: chore/private-release-split-leerness
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned Leerness source
        shell: pwsh
        run: |
          npm install --save-dev --save-exact "git+https://github.com/gugu9999gu/leerness.git#7204fe45dcdeaf51ae932510a5cca43aeb3eb978"

      - name: Add Leerness scripts
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.scripts={...p.scripts,'leerness:init':'leerness init . --yes --minimal --language ko --no-stale-check','leerness:status':'leerness status . --json','leerness:handoff':'leerness handoff . --quiet --no-drift-check','leerness:doctor':'leerness doctor . --json','leerness:finish':'leerness finish .'};fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"

      - name: Initialize Leerness workspace
        shell: pwsh
        env:
          LEERNESS_NO_PROMPT: "1"
          LEERNESS_NO_AUTOCHCP: "1"
          LEERNESS_NO_DRIFT_CHECK: "1"
        run: |
          npx --no-install leerness init . --yes --minimal --language ko --no-stale-check --json
          if (!(Test-Path -LiteralPath ".leerness\HARNESS_VERSION")) { throw "Leerness init did not create .leerness/HARNESS_VERSION" }
          npx --no-install leerness --version

      - name: Commit generated workspace
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .leerness
          if (git diff --cached --quiet) {
            Write-Host "No generated Leerness changes to commit."
            exit 0
          }
          git commit -m "chore: install Leerness development workspace"
          git push origin HEAD:chore/private-release-split-leerness
