name: Publish v1.0.15 Release

on:
  push:
    branches:
      - main
    paths:
      - .release-trigger-v1.0.15

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33587774405 \
            --repo "$GITHUB_REPOSITORY" \
            --name How-much-is-tokens-windows-portable \
            --dir release-artifact

      - name: Verify release asset
        run: |
          test -f release-artifact/How-much-is-tokens-1.0.15-portable.exe
          echo "f38c5ab4cffbda0afb7d40d95361d45c84fb66f9889bfeee74c36a0f0726ba71  release-artifact/How-much-is-tokens-1.0.15-portable.exe" | sha256sum -c -

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## How much is tokens v1.0.15

          ### 엣지 패널 활성/비활성 레이아웃 안정화
          - 엣지 숨김 패널 ON/OFF를 renderer 콘텐츠 레이아웃 변경과 분리
          - 엣지 ON/OFF 자체로는 위젯 content resize를 요청하지 않음
          - 엣지 토글 직전 진행 중인 오래된 resize 응답을 무효화
          - 엣지 reveal/hide/방향 변경/활성화/비활성화 이동을 BrowserWindow의 x/y 위치 전용으로 처리
          - 엣지 애니메이션 중 width/height를 변경하지 않아 헤더, 간소화/설정/숨기기 버튼, 카드 내부 위치를 유지
          - 카드 수, 설정 패널, 토큰 영역 최대 높이처럼 실제 콘텐츠 높이가 바뀔 때만 기존 resize 경로 사용
          - dense layout / token max-height와 edge interaction 상태를 별도 렌더러 함수로 분리

          ### 유지 기능
          - 실행 시 화면 밖 위치 자동 복구
          - 트레이 설정값 초기화
          - 토큰 영역 최대 높이 / 내부 스크롤
          - 촘촘하게
          - 상/우/하/좌 엣지 hover 패널
          - 원형 / 막대 / 숫자 시각화
          - 5시간 / 주간 quota 동시 표시
          - Antigravity 자동 `/usage` 갱신
          - Grok Bot 사용량

          ### 검증
          이 EXE는 `main` commit `25329453fb1f2c02e73c7134ad401bc3c5609feb`에서 GitHub Actions Windows runner로 검증된 artifact입니다.
          - JavaScript syntax check
          - edge toggle no-resize regression test
          - content-layout / edge-interaction separation test
          - position-only edge animation regression test
          - 기존 provider / Antigravity / Grok Bot / quota / visualization / max-height / settings-reset tests
          - Antigravity Windows bridge smoke test
          - electron-builder Windows portable build

          SHA-256: `f38c5ab4cffbda0afb7d40d95361d45c84fb66f9889bfeee74c36a0f0726ba71`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.15"
          ASSET="release-artifact/How-much-is-tokens-1.0.15-portable.exe"
          TARGET="25329453fb1f2c02e73c7134ad401bc3c5609feb"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
