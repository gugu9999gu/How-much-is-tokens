name: Publish v1.0.13 Release

on:
  push:
    branches:
      - main
    paths:
      - .release-trigger-v1.0.13

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33580189373 \
            --repo "$GITHUB_REPOSITORY" \
            --name How-much-is-tokens-windows-portable \
            --dir release-artifact

      - name: Verify release asset
        run: |
          test -f release-artifact/How-much-is-tokens-1.0.13-portable.exe
          echo "a90b405b1e8d03c182f1be51980301ae36b1add46335941de1c0d1b2c3a9a63f  release-artifact/How-much-is-tokens-1.0.13-portable.exe" | sha256sum -c -

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## How much is tokens v1.0.13

          ### 토큰 영역 최대 높이
          - 설정 → 표시에서 `토큰 영역 최대 높이`를 px 단위로 지정
          - `0`은 자동 모드, 양수는 120~2000px 범위로 정규화
          - BrowserWindow 전체가 아니라 토큰 잔여량 카드 목록(`#list`) 영역에만 max-height 적용
          - 카드가 지정 높이를 넘으면 목록 내부에서만 스크롤
          - 제목바와 최상위 shell/padding/border는 고정되어 위젯 외곽 라운딩 디자인 유지
          - 기존 모니터 작업영역 기반 자동 높이 제한, 촘촘하게, 엣지 숨김 패널과 함께 동작

          ### 엣지 방향 연속 변경 버그 수정
          - 상/우/하/좌를 빠르게 반복 선택해도 이전 방향의 hidden/showing 좌표를 새 방향 기준으로 재사용하지 않음
          - 저장된 정상 위치 또는 직전 shown 위치를 stable anchor로 사용
          - 새 방향 선택 시 패널을 완전히 화면 안쪽의 shown bounds로 강제 재초기화
          - revision guard로 연속 변경 시 마지막 선택만 최종 재확인
          - 방향 변경 직후 3.5초 grace 적용
          - Windows가 이동을 처리한 다음 shown bounds를 한 번 더 재적용해 헤더의 간소화/설정/숨기기 버튼이 화면 밖으로 사라지는 현상 방지

          ### 유지 기능
          - 화면 높이 초과 시 내부 스크롤
          - 촘촘하게
          - 상/우/하/좌 엣지 hover 패널
          - 원형 / 막대 / 숫자 시각화
          - 5시간 / 주간 quota 동시 표시
          - Antigravity 자동 `/usage` 갱신
          - Grok Bot 사용량
          - 항상 위에 토글 즉시 적용

          ### Windows
          `How-much-is-tokens-1.0.13-portable.exe`를 설치 없이 실행하면 됩니다.

          ### 검증
          이 EXE는 `main` commit `8b0921f91912266a356bb7dfb504b56d2083efa6`에서 GitHub Actions Windows runner로 검증된 artifact입니다.
          - JavaScript syntax check
          - token-area max-height/default/clamp tests
          - repeated edge-side shown geometry tests
          - stable edge anchor / revision guard tests
          - 기존 Antigravity / Grok Bot / quota / visualization / always-on-top tests
          - Antigravity Windows bridge smoke test
          - electron-builder Windows portable build

          SHA-256: `a90b405b1e8d03c182f1be51980301ae36b1add46335941de1c0d1b2c3a9a63f`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.13"
          ASSET="release-artifact/How-much-is-tokens-1.0.13-portable.exe"
          TARGET="8b0921f91912266a356bb7dfb504b56d2083efa6"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
