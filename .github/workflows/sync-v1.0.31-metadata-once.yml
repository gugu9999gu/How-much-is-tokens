name: Sync v1.0.31 metadata once

on:
  push:
    branches:
      - feat/v1.0.31-complete-account-automation
    paths:
      - .github/workflows/sync-v1.0.31-metadata-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1.0.31-complete-account-automation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync package lock and account parser
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = pkg.version;
          if (lock.packages && lock.packages['']) lock.packages[''].version = pkg.version;
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');

          const appPath = 'renderer/app.js';
          let app = fs.readFileSync(appPath, 'utf8');
          const before = 'const MULTI_ACCOUNT_PROVIDERS = new Set(["codex", "claude", "grok"]);';
          const after = 'const MULTI_ACCOUNT_PROVIDERS = new Set(["codex", "claude", "grok", "cursor", "copilot"]);';
          if (!app.includes(before) && !app.includes(after)) throw new Error('MULTI_ACCOUNT_PROVIDERS declaration not found');
          app = app.replace(before, after);
          fs.writeFileSync(appPath, app);
          NODE
      - name: Commit synchronized metadata
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json renderer/app.js
          git commit -m "chore: sync v1.0.31 package metadata and account parser"
          git push origin HEAD:feat/v1.0.31-complete-account-automation
