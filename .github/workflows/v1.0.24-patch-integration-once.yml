name: Patch v1.0.24 Integration Once

on:
  push:
    branches:
      - feat/v1.0.24-openrouter-local-router

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/v1.0.24-openrouter-local-router
          fetch-depth: 0

      - name: Apply integration patch
        run: node scripts/v1.0.24-patch-integration.js

      - name: Commit integration patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js renderer/index.html
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "feat: wire v1.0.24 OpenRouter router UI"
          git push origin HEAD:feat/v1.0.24-openrouter-local-router
